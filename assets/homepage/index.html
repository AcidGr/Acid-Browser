<!DOCTYPE html>
<!-- ACID_DEFAULT_HOMEPAGE -->
<html lang="zh-CN">
<head>
    <script src="https://acid-favicon.local/preload.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>Acid</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(180deg, #F8FAFC 0%, #EEF2F6 100%);
            --text-main: #1E293B;
            --text-muted: #64748B;
            --search-bg: #FFFFFF;
            --search-border: rgba(226, 232, 240, 0.9);
            --search-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.06), 0 2px 6px -1px rgba(15, 23, 42, 0.04);
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(226, 232, 240, 0.85);
            --card-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
            --tile-text: #334155;
            --badge-bg: #FFFFFF;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-gradient: linear-gradient(180deg, #090D14 0%, #0F172A 100%);
                --text-main: #F1F5F9;
                --text-muted: #94A3B8;
                --search-bg: rgba(30, 41, 59, 0.75);
                --search-border: rgba(51, 65, 85, 0.85);
                --search-shadow: 0 4px 24px -2px rgba(0, 0, 0, 0.45);
                --card-bg: rgba(30, 41, 59, 0.65);
                --card-border: rgba(51, 65, 85, 0.65);
                --card-shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
                --tile-text: #E2E8F0;
                --badge-bg: #1E293B;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: var(--bg-gradient);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            user-select: none;
            transition: background 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 580px;
            height: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: calc(env(safe-area-inset-top, 16px) + 44px) 16px 0;
        }

        /* 固定不动的上半部分：小地球图标 + 提示语 + 搜索框 */
        .top-fixed {
            width: 100%;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-widget {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        .brand-globe {
            width: 88px;
            height: 88px;
            object-fit: contain;
            display: block;
            margin-bottom: 12px;
            filter: drop-shadow(0 6px 18px rgba(13, 128, 242, 0.22));
            pointer-events: none;
        }

        @media (prefers-color-scheme: dark) {
            .brand-globe {
                filter: drop-shadow(0 6px 22px rgba(56, 189, 248, 0.28));
            }
        }

        .quote-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 90vw;
            padding: 4px 14px;
            border-radius: 12px;
        }

        .quote-text {
            font-size: 13.5px;
            line-height: 1.55;
            color: var(--text-muted);
            text-align: center;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        /* 搜索栏（固定在顶部区域底部） */
        .search-container {
            width: 100%;
            margin-bottom: 16px;
        }

        .search-form {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--search-bg);
            border: 1.5px solid var(--search-border);
            border-radius: 24px;
            box-shadow: var(--search-shadow);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 4px 6px 4px 16px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .search-form:focus-within {
            border-color: #3B82F6;
            box-shadow: 0 6px 24px -2px rgba(59, 130, 246, 0.25);
        }

        .search-icon {
            width: 18px;
            height: 18px;
            stroke: var(--text-muted);
            stroke-width: 2.2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            margin-right: 10px;
            flex-shrink: 0;
        }

        .search-input {
            width: 100%;
            height: 42px;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text-main);
            font-size: 14.5px;
            font-weight: 500;
        }

        .search-input::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
        }

        .search-btn {
            width: 38px;
            height: 38px;
            border: none;
            background: linear-gradient(135deg, #3B82F6, #2563EB);
            color: #FFFFFF;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        .search-btn:active {
            transform: scale(0.92);
        }

        .search-btn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* 独立垂直滚动的书签区域：仅书签图标列表可上下滑动，搜索框及以上保持静止 */
        .bookmark-section {
            width: 100%;
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            padding: 8px 2px calc(env(safe-area-inset-bottom, 20px) + 28px);
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .bookmark-section::-webkit-scrollbar {
            display: none;
        }

        .bookmark-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px 10px;
            justify-items: center;
        }

        @media (min-width: 480px) {
            .bookmark-grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        .bookmark-tile {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            width: 68px;
            transition: transform 0.15s ease;
        }

        .bookmark-tile:active {
            transform: scale(0.92);
        }

        .tile-icon-wrapper {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            box-shadow: var(--card-shadow);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 6px;
            overflow: hidden;
            position: relative;
        }

        .tile-favicon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            object-fit: contain;
            display: block;
        }

        .tile-avatar {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFFFFF;
            font-size: 15px;
            font-weight: 700;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        .tile-title {
            font-size: 11.5px;
            color: var(--tile-text);
            font-weight: 500;
            width: 100%;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>

        <!-- 独立可向下滚动的实时书签收藏网格 -->

    <script>
        function handleSearch(e) {
            e.preventDefault();
            const input = document.getElementById('search-input');
            const q = input.value.trim();
            if (!q) return false;
            window.location.href = 'acid://search?q=' + encodeURIComponent(q);
            return false;
        }

        const FALLBACK_BOOKMARKS = [
            { title: 'Google', url: 'https://www.google.com' },
            { title: 'GitHub', url: 'https://github.com' },
            { title: 'Bilibili', url: 'https://www.bilibili.com' },
            { title: '知乎', url: 'https://www.zhihu.com' },
            { title: 'Hacker News', url: 'https://news.ycombinator.com' },
            { title: '百度', url: 'https://www.baidu.com' }
        ];

        const PALETTE = [
            '#3B82F6', '#10B981', '#F59E0B', '#EF4444',
            '#8B5CF6', '#EC4899', '#06B6D4', '#6366F1'
        ];

        function getDeterministicColor(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            return PALETTE[Math.abs(hash) % PALETTE.length];
        }

        const BOOKMARKS_SNAP_KEY = 'acid_bookmarks_snap_v2';
        const ICON_DATA_CACHE_KEY = 'acid_favicon_data_v2';

        let iconDataMap = {};
        try {
            const raw = localStorage.getItem(ICON_DATA_CACHE_KEY);
            if (raw) iconDataMap = JSON.parse(raw) || {};
        } catch (e) {}

        function saveIconDataToCache(host, dataUri) {
            if (!host || !dataUri) return;
            if (iconDataMap[host] === dataUri) return;
            iconDataMap[host] = dataUri;
            try {
                localStorage.setItem(ICON_DATA_CACHE_KEY, JSON.stringify(iconDataMap));
            } catch (e) {}
        }

        // 离屏静默加载尚未缓存的站点图标（使用 new Image 避免 file:// 下 fetch 跨域限制）：
        // - 默认保持彩色首字母状态稳态显示（绝不留白、绝不闪烁）
        // - 仅当后台真正加载出有效图标时才无感替换，同时由原生层自动写入 cache/favicons/ 持久化
        const pendingFetches = {};
        function revalidateFaviconSilently(host, wrapper, title) {
            if (!host || pendingFetches[host]) return;
            pendingFetches[host] = true;
            const probeImg = new Image();
            probeImg.className = 'tile-favicon';
            probeImg.alt = title || host;
            probeImg.onload = function() {
                delete pendingFetches[host];
                if (probeImg.naturalWidth > 1 && probeImg.naturalHeight > 1 && wrapper) {
                    wrapper.innerHTML = '';
                    wrapper.appendChild(probeImg);
                }
            };
            probeImg.onerror = function() {
                delete pendingFetches[host];
            };
            probeImg.src = 'https://acid-favicon.local/icon?host=' + encodeURIComponent(host);
        }

        function getHostKey(url) {
            try {
                const u = new URL(url);
                return (u.host || u.hostname || '').toLowerCase();
            } catch (e) {
                return '';
            }
        }

        let lastRenderedSignature = null;
        const hostWrapperMap = {};

        function applyIconToWrapper(wrapper, dataUri, title) {
            if (!wrapper || !dataUri) return;
            const currentImg = wrapper.querySelector('img.tile-favicon');
            if (currentImg && currentImg.getAttribute('src') === dataUri) return;
            const testImg = new Image();
            testImg.className = 'tile-favicon';
            testImg.alt = title || '';
            testImg.onload = function() {
                if (testImg.naturalWidth > 1 && testImg.naturalHeight > 1) {
                    wrapper.innerHTML = '';
                    wrapper.appendChild(testImg);
                }
            };
            testImg.src = dataUri;
        }

        function renderBookmarks(list, persistSnap) {
            const items = (Array.isArray(list) && list.length > 0) ? list : FALLBACK_BOOKMARKS;
            const cleanItems = items.map(it => ({
                title: (it && it.title) ? it.title : '',
                url: (it && it.url) ? it.url : '',
                icon: (it && it.icon) ? it.icon : ''
            }));
            const sig = JSON.stringify(cleanItems);
            if (sig === lastRenderedSignature) return;
            lastRenderedSignature = sig;

            if (persistSnap) {
                try {
                    localStorage.setItem(BOOKMARKS_SNAP_KEY, sig);
                } catch (e) {}
            }

            const grid = document.getElementById('bookmark-grid');
            if (!grid) return;
            grid.innerHTML = '';

            items.forEach(item => {
                if (!item || !item.url || !item.title) return;
                const tile = document.createElement('a');
                tile.className = 'bookmark-tile';
                tile.href = item.url;
                tile.title = item.title;

                const wrapper = document.createElement('div');
                wrapper.className = 'tile-icon-wrapper';

                let host = getHostKey(item.url);
                if (host) hostWrapperMap[host] = wrapper;

                const makeAvatar = () => {
                    const avatar = document.createElement('div');
                    avatar.className = 'tile-avatar';
                    avatar.style.background = getDeterministicColor(item.title);
                    avatar.textContent = (item.title.trim()[0] || 'A').toUpperCase();
                    return avatar;
                };

                const cachedDataUri = item.icon || (host ? iconDataMap[host] : null);
                if (cachedDataUri) {
                    // 已缓存图标：第 0 毫秒直接同步渲染，零网络请求、零闪烁
                    const img = document.createElement('img');
                    img.className = 'tile-favicon';
                    img.alt = item.title;
                    img.src = cachedDataUri;
                    img.onerror = function() {
                        wrapper.innerHTML = '';
                        wrapper.appendChild(makeAvatar());
                    };
                    wrapper.appendChild(img);
                } else {
                    // 尚未缓存图标：第 0 毫秒先稳稳展示默认首字母状态（绝不留白、绝不闪烁），后台静默探测
                    wrapper.appendChild(makeAvatar());
                }

                if (host && !cachedDataUri) {
                    revalidateFaviconSilently(host, wrapper, item.title);
                }

                const label = document.createElement('div');
                label.className = 'tile-title';
                label.textContent = item.title;

                tile.appendChild(wrapper);
                tile.appendChild(label);
                grid.appendChild(tile);
            });
        }

        // 1. 首屏第 0 毫秒同步渲染 <head> 中 preload.js 注入的真实书签与本地已缓存的 Base64 图标（0 延迟、0 闪烁）
        window.__updateAcidLanguage = function(lang) {
            const isEn = (lang === 'en') || (!lang && (navigator.language || '').toLowerCase().indexOf('en') === 0);
            if (document.documentElement) {
                document.documentElement.lang = isEn ? 'en' : 'zh-CN';
            }
            const q = document.getElementById('quote-text');
            if (q && (q.textContent === '你可以让Agent帮你自定义主页' || q.textContent === 'Ask Agent to customize your homepage')) {
                q.textContent = isEn ? 'Ask Agent to customize your homepage' : '你可以让Agent帮你自定义主页';
            }
            const s = document.getElementById('search-input');
            if (s && (!s.placeholder || s.placeholder === '搜索或输入网址...' || s.placeholder === 'Search or enter URL...')) {
                s.placeholder = isEn ? 'Search or enter URL...' : '搜索或输入网址...';
            }
            const btn = document.querySelector('.search-btn');
            if (btn) {
                btn.setAttribute('aria-label', isEn ? 'Search' : '搜索');
            }
        };
        window.__updateAcidLanguage(window.__ACID_LANG);

        (function initFirstPaint() {
            if (Array.isArray(window.__INITIAL_BOOKMARKS) && window.__INITIAL_BOOKMARKS.length > 0) {
                window.__INITIAL_BOOKMARKS.forEach(it => {
                    if (it && it.url && it.cachedIcon) {
                        const h = getHostKey(it.url);
                        if (h) iconDataMap[h] = it.cachedIcon;
                    }
                });
                renderBookmarks(window.__INITIAL_BOOKMARKS, true);
                return;
            }
            try {
                const saved = localStorage.getItem(BOOKMARKS_SNAP_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        renderBookmarks(parsed, false);
                    }
                }
            } catch (e) {}
        })();

        // 2. 接收来自 BrowserController 的原生实时书签推送（含预注入的 cachedIcon）
        window.__updateAcidBookmarks = function(bookmarksList) {
            if (Array.isArray(bookmarksList)) {
                bookmarksList.forEach(it => {
                    if (it && it.url && it.cachedIcon) {
                        const h = getHostKey(it.url);
                        if (h) {
                            const prev = iconDataMap[h];
                            saveIconDataToCache(h, it.cachedIcon);
                            if (prev !== it.cachedIcon && hostWrapperMap[h]) {
                                applyIconToWrapper(hostWrapperMap[h], it.cachedIcon, it.title);
                            }
                        }
                    }
                });
                renderBookmarks(bookmarksList, true);
            }
        };

        // 3. 同时支持从工作区 ../bookmarks.json 实时拉取（延迟兜底避免抢在原生推送前闪出 6 个默认书签）
        function scheduleFallbackIfNeeded() {
            setTimeout(function() {
                if (lastRenderedSignature === null) {
                    renderBookmarks(FALLBACK_BOOKMARKS, false);
                }
            }, 220);
        }

        function pollWorkspaceBookmarks() {
            try {
                const xhr = new XMLHttpRequest();
                xhr.open('GET', '../bookmarks.json?_t=' + Date.now(), true);
                xhr.onload = function() {
                    if (xhr.status === 200 || (xhr.status === 0 && xhr.responseText)) {
                        try {
                            const parsed = JSON.parse(xhr.responseText);
                            if (Array.isArray(parsed)) {
                                renderBookmarks(parsed, true);
                                return;
                            }
                        } catch (e) {}
                    }
                    scheduleFallbackIfNeeded();
                };
                xhr.onerror = scheduleFallbackIfNeeded;
                xhr.send();
            } catch (e) {
                scheduleFallbackIfNeeded();
            }
        }

        pollWorkspaceBookmarks();
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) pollWorkspaceBookmarks();
        });
        window.addEventListener('focus', pollWorkspaceBookmarks);
    </script>
</body>
</html>
